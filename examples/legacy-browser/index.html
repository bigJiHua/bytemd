<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Bytemd without a bundler (ESM CDN)</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bytemd/dist/index.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/github-markdown-css" />
  </head>
  <body>
    <!--
      The fork ships ESM/CJS only; the UMD and ES5 bundles were retired.
      Legacy browsers need a bundler plus an ESNext -> ES5 transpiler against
      the npm package. This page demonstrates modern no-bundler usage through
      jsDelivr's on-the-fly ESM transform.
    -->
    <script type="module">
      import Editor from 'https://cdn.jsdelivr.net/npm/bytemd/+esm'
      import { default as gfm } from 'https://cdn.jsdelivr.net/npm/@bytemd/plugin-gfm/+esm'

      let value = '# heading\n\nparagraph\n\n> blockquote'
      const editor = new Editor({
        target: document.body,
        props: {
          value: value,
          plugins: [gfm()],
        },
      })
      editor.$on('change', function (e) {
        value = e.detail.value
      })
    </script>
  </body>
</html>
