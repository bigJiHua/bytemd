name: browser-e2e

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'packages/bytemd/**'
      - 'packages/*/src/**'
      - 'playground/**'
      - 'audit/cm6-*.mjs'
      - 'audit/prod-perf-*.mjs'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

jobs:
  cm6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm generate:check
      - run: git diff --exit-code
      - name: Build packages
        run: pnpm build
      - name: Build playground (production)
        run: pnpm --filter playground build
      - name: Build audit consumer page (production)
        run: pnpm exec vite build --config audit/prod-perf-vite.config.mjs
      - name: Locate Chrome
        id: chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome not found" >&2
            exit 1
          fi
          echo "chrome-path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version
      - name: CM6 input, actions, IME and undo
        run: node audit/cm6-v2-input-verify.mjs 5190
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: CM6 themes, Enter continuation and 100 mount/destroy cycles
        run: node audit/cm6-closeout-verify.mjs 5186
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm6-browser-results
          path: |
            audit/cm6-v2-input-results.json
            audit/cm6-closeout-results.json
          if-no-files-found: ignore
          retention-days: 7
